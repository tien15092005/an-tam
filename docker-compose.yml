# Run the whole stack on one laptop: docker compose up --build
# Ports bind to 127.0.0.1 only. The HTTPS tunnel (Phase 1) exposes just the backend.
# Every service restarts by itself after a crash or when Docker starts again (e.g. after a reboot).
# Images are pinned by digest (here and in the Dockerfiles) so a rebuild gives the same result.
services:
  db:
    image: postgres:18@sha256:a47637053e65dc7112aeb7353feb8b87954982ad5fd4524908c284d90d71b5e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: antam
      POSTGRES_USER: antam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antam -d antam"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Copy .env.example to .env and set AI_SERVICE_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    # The image has no curl: ask /api/health over a plain TCP socket with bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      DB_URL: jdbc:postgresql://db:5432/antam
      DB_USER: antam
      DB_PASSWORD: ${DB_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      CODES_SECRET: ${CODES_SECRET:?Copy .env.example to .env and set CODES_SECRET}
      MEDIA_DIR: /data/media
      # Optional: put the Firebase service-account file at ./secrets/firebase.json (git-ignored)
      # and set FIREBASE_CREDENTIALS=/secrets/firebase.json in .env to turn pushes on.
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - media-data:/data/media
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
  media-data:
