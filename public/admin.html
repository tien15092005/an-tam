<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>An Tâm – Quản trị</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo"><img src="/icon.svg" alt="">An Tâm <span class="hint" style="font-weight:500">· Quản trị</span></div>
    <div class="row">
      <span class="who hint" id="me-name"></span>
      <button class="btn sm" id="logout-btn">Đăng xuất</button>
    </div>
  </header>
  <main style="max-width:1200px;margin:0 auto;padding:20px 16px">
    <div class="stats" id="stats"></div>
    <div class="section-title">
      <h3>Người dùng</h3>
      <div class="row">
        <select id="role-filter" style="width:auto">
          <option value="">Tất cả vai trò</option>
          <option value="child">Người con</option>
          <option value="elder">Bố mẹ</option>
          <option value="admin">Admin</option>
        </select>
        <input id="search" placeholder="Tìm tên, email…" style="width:220px">
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Vai trò</th><th>Tên</th><th>Email / SĐT</th><th>Liên kết</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </main>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
