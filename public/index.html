<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>An Tâm – Nhắc bố mẹ uống thuốc</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f7a5c">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="auth">
    <div class="brand">
      <img src="/icon.svg" alt="">
      <h1>An Tâm</h1>
      <p>Nhắc bố mẹ uống thuốc – con yên tâm theo dõi</p>
    </div>

    <!-- Chọn vai trò -->
    <section id="choose" class="choice">
      <button data-go="elder-auth">
        <span class="ico">👵</span>
        <span><b>Tôi là bố / mẹ</b><span class="hint">Nhập mã 6 số con đã gửi</span></span>
      </button>
      <button data-go="child-auth">
        <span class="ico">👨‍👩‍👧</span>
        <span><b>Tôi là người con</b><span class="hint">Đăng nhập để theo dõi bố mẹ</span></span>
      </button>
    </section>

    <!-- Người con / admin -->
    <section id="child-auth" class="card" hidden>
      <button class="btn ghost sm back" data-go="choose">← Quay lại</button>
      <div class="tabs">
        <button class="active" data-tab="login">Đăng nhập</button>
        <button data-tab="register">Đăng ký</button>
      </div>
      <form id="login-form">
        <label for="l-email">Email</label>
        <input id="l-email" name="email" type="email" autocomplete="email" required>
        <label for="l-pw">Mật khẩu</label>
        <input id="l-pw" name="password" type="password" autocomplete="current-password" required>
        <div class="error"></div>
        <button class="btn primary" style="width:100%;margin-top:8px">Đăng nhập</button>
      </form>
      <form id="register-form" hidden>
        <label for="r-name">Họ tên</label>
        <input id="r-name" name="name" required>
        <label for="r-email">Email</label>
        <input id="r-email" name="email" type="email" autocomplete="email" required>
        <label for="r-phone">Số điện thoại <span class="hint">(để bố mẹ bấm gọi)</span></label>
        <input id="r-phone" name="phone" type="tel">
        <label for="r-pw">Mật khẩu</label>
        <input id="r-pw" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <div class="error"></div>
        <button class="btn primary" style="width:100%;margin-top:8px">Tạo tài khoản</button>
      </form>
    </section>

    <!-- Bố mẹ: nhập mã -->
    <section id="elder-auth" class="card" hidden>
      <button class="btn ghost sm back" data-go="choose">← Quay lại</button>
      <form id="elder-form">
        <h2 style="text-align:center">Nhập mã của bạn</h2>
        <p class="hint" style="text-align:center">Mã 6 số do con tạo trong ứng dụng</p>
        <input class="code-input" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
        <div class="error" style="text-align:center;font-size:17px"></div>
        <button class="btn primary" style="width:100%;margin-top:10px;font-size:20px;padding:.7em">Vào ứng dụng</button>
      </form>
    </section>
  </main>
  <script src="/common.js"></script>
  <script src="/index.js"></script>
</body>
</html>
