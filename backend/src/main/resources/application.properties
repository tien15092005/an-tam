spring.application.name=an-tam-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/antam}
spring.datasource.username=${DB_USER:antam}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

antam.jwt.secret=${JWT_SECRET}
antam.codes.secret=${CODES_SECRET}

antam.media.dir=${MEDIA_DIR:./data/media}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

antam.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
antam.ai.token=${AI_SERVICE_TOKEN}
antam.ai.timeout=5s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
